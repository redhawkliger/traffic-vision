# PINNED TRACKER for tools/track.py (default). Provenance: copy of the installed
# ultralytics 8.4.171 cfg/trackers/tracktrack.yaml (ultralytics' default tracker for
# mode="track" in that version) with ONLY these three thresholds lowered so weak
# detections (conf 0.15-0.6) can start and keep tracks:
#   track_high_thresh 0.6 -> 0.25, new_track_thresh 0.7 -> 0.25, track_low_thresh 0.25 -> 0.1
# Evidence: scratch_diag/exp/ (tt_*.yaml, w2/*.report.txt) - on the Brea dev stretch this
# recovered a motorbike and a truck with no other crossings gained or lost.
# Everything else is verbatim from the installed file. Edit => the header recorded in each
# tracks JSON changes; never rely on the library default (invisible, version-dependent).
